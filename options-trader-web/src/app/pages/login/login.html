<div class="login-wrap">

  <!-- Brand -->
  <div class="brand">
    <i class="ti ti-triangle-filled"></i>
    <h1>OptionsTrader</h1>
    <p>Sign in to your account</p>
  </div>

  <!-- Card -->
  <div class="card">
    <form (submit)="onSubmit(); $event.preventDefault()">

      <!-- Username field -->
      <div class="field">
        <label for="username">Username</label>
        <div class="input-row">
          <i class="ti ti-user"></i>
          <input id="username" type="text" placeholder="Enter username" [(ngModel)]="username" name="username" autocomplete="username" />
        </div>
      </div>

      <!-- Password field -->
      <div class="field">
        <label for="password">Password</label>
        <div class="input-row">
          <i class="ti ti-lock"></i>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Enter password"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
          />
          <button class="toggle-pw" type="button" (click)="togglePassword()">
            <i class="ti" [class.ti-eye-off]="!showPassword()" [class.ti-eye]="showPassword()"></i>
          </button>
        </div>
      </div>

      <!-- Remember me + Forgot -->
      <div class="remember-row">
        <label class="remember-left">
          <input type="checkbox" />
          <span>Remember me</span>
        </label>
        <a class="forgot-link">Forgot password?</a>
      </div>

      <!-- Error -->
      <p class="error-msg" *ngIf="error()">
        <i class="ti ti-alert-circle"></i>
        <span>{{ error() }}</span>
      </p>

      <!-- Sign In -->
      <button type="submit" class="btn-signin" [disabled]="loading()">
        <i class="ti ti-login"></i>
        {{ loading() ? 'Signing in…' : 'Sign In' }}
      </button>

    </form>
  </div>

  <!-- Footer -->
  <div class="footer">2026 OptionsTrader &mdash; Personal trading journal</div>

</div>
